<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Indian Nutrition Calculator</title>
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h2 class="mb-0">Error</h2>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-danger">
                            <p><strong>{{ error }}</strong></p>
                        </div>
                        <p>Please try one of the following:</p>
                        <ul>
                            <li>Return to the <a href="{{ url_for('index') }}">home page</a></li>
                            <li>Try searching for a different dish</li>
                            <li>Check that all required data files are available</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
